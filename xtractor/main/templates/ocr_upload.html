{% extends "base.html" %}
{% block styles %}
<style>
  .rotate-icon {
    transition: transform 0.1s ease-in-out;
  }

  .rotate-icon.rotate {
    transform: rotate(90deg);
  }
</style>
{% endblock %}

{% block content %}

<h2>Upload Azure OCR .txt Result</h2>
<form action="{% url 'main:get_ave' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
     <input type="file" name="file" required>
    <button type="submit">Upload</button>
</form>
{% endblock %}
